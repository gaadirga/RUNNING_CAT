<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RUNNING CAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Rubik+Mono+One&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1038;
  --plum:#3b1f5e;
  --coral:#ff5c7a;
  --gold:#ffc86b;
  --cyan:#35e8d8;
  --text:#fff4e6;
  --muted:#cdbbe8;
  --display:'Rubik Mono One','Arial Black',Impact,sans-serif;
  --body:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--ink)}
body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-touch-callout:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}

#stage{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--ink);touch-action:none}

/* ---------- logo ---------- */
.logo{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(40px,12.5vmin,128px);line-height:1;
  letter-spacing:-.02em;white-space:nowrap;transform:skewX(-8deg);
  filter:drop-shadow(0 .05em 0 var(--ink)) drop-shadow(0 .12em .28em rgba(255,92,122,.4))}
.logo .ch{display:inline-block;background:linear-gradient(180deg,var(--gold) 20%,var(--coral) 95%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.logo .ch.sp{width:.38em}
.logo .ch.cur{background:none;-webkit-text-fill-color:var(--cyan);color:var(--cyan);animation:blink 1s steps(1,end) infinite}
.logo.intro .ch{animation:drop .65s cubic-bezier(.2,1.3,.35,1) both;animation-delay:calc(var(--i)*70ms)}
.logo.intro .ch.cur{animation:drop .65s cubic-bezier(.2,1.3,.35,1) both,blink 1s steps(1,end) infinite;
  animation-delay:calc(var(--i)*70ms),1s}
@keyframes drop{from{opacity:0;transform:translateY(-.7em)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}

/* ---------- loader ---------- */
.loader{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  gap:clamp(18px,4vmin,34px);padding:24px 20px max(8vh,34px);
  background-color:#160d3a;background-image:url('running-cat-bg.webp');
  background-size:cover;background-position:center;background-repeat:no-repeat;
  clip-path:inset(0 0 0 0);transition:clip-path .85s cubic-bezier(.77,0,.18,1);overflow:hidden}
.loader:before{content:"";position:absolute;left:0;right:0;bottom:0;height:39%;z-index:0;
  background:linear-gradient(180deg,rgba(22,13,58,0),rgba(22,13,58,.93) 18%,rgba(22,13,58,.98))}
.loader.done{clip-path:inset(0 0 0 100%);pointer-events:none}
#loadLogo{display:none}
.prog{position:relative;z-index:1;width:min(560px,88vw);margin-bottom:1vh}
@media (max-aspect-ratio: 3/4){.loader{background-size:auto 100%;background-position:center top}.loader:before{height:35%}.prog{width:min(520px,90vw)}}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;
  font-size:clamp(14px,2.3vmin,17px);color:#fff4ff;text-shadow:0 2px 8px #160d3a;font-weight:700}
.prog-pct{font-family:var(--display);font-size:clamp(18px,3.6vmin,30px);color:var(--text)}
.bar{position:relative;height:18px;border-radius:99px;background:rgba(10,5,35,.88);border:2px solid rgba(255,255,255,.65);
  box-shadow:0 0 0 3px rgba(160,105,255,.35),0 0 26px rgba(53,232,216,.18);overflow:visible}
.bar-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;
  background:repeating-linear-gradient(115deg,var(--gold) 0 12px,var(--coral) 12px 24px);
  background-size:34px 100%;animation:barmove .6s linear infinite}
.bar-dot{position:absolute;top:50%;left:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:7px;
  background:var(--cyan);transform:rotate(45deg);box-shadow:0 0 20px var(--cyan)}
@keyframes barmove{to{background-position:34px 0}}

/* ---------- layar umum ---------- */
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center}
.menu{justify-content:flex-start;padding:clamp(28px,10vh,110px) 20px 0;gap:clamp(14px,3.2vh,28px);text-align:center}
.menu .tag{margin:0;max-width:30ch;font-size:clamp(15px,2.4vmin,19px);text-shadow:0 2px 12px rgba(18,10,44,.8)}
.menu .best{margin:0;color:var(--gold);font-weight:600;font-size:clamp(14px,2.2vmin,17px);text-shadow:0 2px 10px rgba(18,10,44,.9)}
.menu .best b{font-family:var(--display);font-weight:400;margin-left:.4em;color:var(--text)}
.hints{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;gap:10px 22px;
  flex-wrap:wrap;justify-content:center;font-size:14px;color:var(--text);text-shadow:0 2px 8px rgba(18,10,44,.9);padding:0 16px}
.hints span.g{display:inline-flex;align-items:center;gap:6px}
.key{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:8px;
  background:rgba(255,244,230,.16);border:1px solid rgba(255,244,230,.32);font-weight:700}
.hint-touch{display:none!important}
@media (pointer:coarse){.hint-kb{display:none!important}.hint-touch{display:inline-flex!important}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;transition:transform .12s ease,box-shadow .12s ease}
.btn.primary{background:var(--gold);color:var(--ink);font-family:var(--display);font-size:clamp(16px,2.6vmin,21px);
  padding:.95em 2.6em;border-radius:999px;box-shadow:0 6px 0 #b9852f,0 16px 34px rgba(255,92,122,.4)}
.btn.primary:hover{transform:translateY(-2px)}
.btn.primary:active{transform:translateY(4px);box-shadow:0 2px 0 #b9852f,0 6px 14px rgba(255,92,122,.4)}
.btn.ghost{border:2px solid rgba(255,244,230,.4);padding:.8em 1.6em;border-radius:999px;font-weight:600;background:rgba(18,10,44,.35)}
.btn.ghost:hover{border-color:var(--cyan);color:var(--cyan)}

.veil{justify-content:center;background:rgba(18,10,44,.58);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:20px}
.panel{width:min(92vw,400px);padding:28px 26px 26px;border-radius:24px;text-align:center;
  background:rgba(26,16,56,.82);border:1px solid rgba(255,200,107,.28);box-shadow:0 24px 60px rgba(0,0,0,.45)}
.panel h2{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:clamp(22px,4.4vmin,30px);color:var(--coral)}
.panel .big{font-family:var(--display);font-size:clamp(40px,9vmin,64px);color:var(--gold);line-height:1.1;margin:6px 0 4px}
.panel .rec{display:inline-block;margin:6px 0 2px;padding:5px 14px;border-radius:999px;background:var(--cyan);color:var(--ink);font-weight:700;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 22px}
.stats div{padding:10px 4px;border-radius:14px;background:rgba(255,244,230,.08)}
.stats dt{font-size:13px;color:var(--muted)}
.stats dd{margin:2px 0 0;font-weight:700;font-size:18px}
.stack{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ---------- HUD ---------- */
.hud{position:fixed;inset:0;z-index:10;pointer-events:none}
.hud-left{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:calc(env(safe-area-inset-left,0px) + 16px);
  display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-shadow:0 2px 10px rgba(18,10,44,.9)}
.score-num{font-family:var(--display);font-size:clamp(28px,6.4vmin,52px);line-height:1;color:var(--gold)}
.sub{display:flex;gap:14px;align-items:center;font-weight:600;font-size:clamp(14px,2.2vmin,17px)}
.coin-chip{display:inline-flex;align-items:center;gap:6px}
.coin-chip i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff0b8,var(--gold) 60%,#c58a2c);display:block}
.coin-chip.pulse{animation:pulse .25s ease}
@keyframes pulse{50%{transform:scale(1.25)}}
.speed{width:clamp(130px,26vmin,190px);font-size:13px;font-weight:600;color:var(--text)}
.speed-bar{position:relative;height:8px;margin-top:4px;border-radius:99px;overflow:hidden;
  background:linear-gradient(90deg,var(--cyan),var(--gold) 55%,var(--coral))}
.speed-mask{position:absolute;right:0;top:0;bottom:0;width:100%;background:rgba(26,16,56,.88)}
.shield-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--cyan);color:var(--ink);font-weight:700;font-size:13px}
.hud-right{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 16px);display:flex;gap:10px}
.round{pointer-events:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:rgba(26,16,56,.62);border:1px solid rgba(255,244,230,.28);color:var(--text);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.round:hover{border-color:var(--cyan);color:var(--cyan)}
.round .slash{display:none}
.round.muted .wave{display:none}
.round.muted .slash{display:block}
.menu-sound{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 16px);z-index:25}

.count{position:fixed;inset:0;z-index:15;display:grid;place-items:center;pointer-events:none;
  font-family:var(--display);font-size:clamp(80px,24vmin,230px);color:var(--gold);
  text-shadow:0 8px 0 rgba(26,16,56,.7),0 0 40px rgba(255,92,122,.6);padding-bottom:20vh}
.count.pop span{display:inline-block;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}60%{opacity:1}to{transform:scale(1);opacity:1}}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 22%);z-index:16;transform:translateX(-50%);opacity:0;pointer-events:none;
  padding:8px 18px;border-radius:999px;background:rgba(26,16,56,.8);border:1px solid var(--cyan);color:var(--cyan);
  font-weight:700;font-size:clamp(14px,2.4vmin,18px);white-space:nowrap}
.toast.show{animation:toast 1.6s ease both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}

/* ---------- kontrol sentuh ---------- */
.pad{display:none}
@media (pointer:coarse){
  .pad{display:flex;position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
    padding:0 calc(env(safe-area-inset-right,0px) + 14px) 0 calc(env(safe-area-inset-left,0px) + 14px);
    justify-content:space-between;pointer-events:none}
  .pad .grp{display:flex;gap:10px}
  .pad button{pointer-events:auto;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;
    background:rgba(26,16,56,.5);border:1px solid rgba(255,244,230,.3);color:var(--text)}
  .pad button:active{background:rgba(53,232,216,.35)}
}

@media (prefers-reduced-motion:reduce){
  .logo.intro .ch,.logo.intro .ch.cur{animation:none}
  .bar-fill{animation:none}
  .count.pop span{animation:none}
  .loader{transition:none}
}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="hud" class="hud" hidden>
  <div class="hud-left">
    <div class="score-num" id="hScore">0</div>
    <div class="sub">
      <span id="hDist">0 m</span>
      <span class="coin-chip" id="hCoinChip"><i></i><b id="hCoins">0</b></span>
    </div>
    <div class="speed">
      <span id="hSpeedTxt">Kecepatan ×1.0</span>
      <div class="speed-bar"><div class="speed-mask" id="hSpeedMask"></div></div>
    </div>
    <span class="shield-badge" id="shieldBadge" hidden>Perisai aktif</span>
  </div>
  <div class="hud-right">
    <button class="round" id="btnSoundHud" aria-label="Suara" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="slash" d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>
    <button class="round" id="btnPause" aria-label="Jeda">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
    </button>
  </div>
  <div class="pad" id="pad">
    <div class="grp">
      <button data-act="left" aria-label="Pindah ke kiri"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button data-act="right" aria-label="Pindah ke kanan"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="grp">
      <button data-act="slide" aria-label="Geser"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg></button>
      <button data-act="jump" aria-label="Lompat"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg></button>
    </div>
  </div>
</div>

<div id="count" class="count" hidden><span id="countTxt"></span></div>
<div id="toast" class="toast" role="status"></div>

<section id="menu" class="screen menu" hidden>
  <h1 class="logo" id="menuLogo" aria-label="RUNNING CAT"></h1>
  <p class="tag">Hindari rintangan, kumpulkan koin, dan jangan berhenti. Makin lama, makin cepat.</p>
  <button class="btn primary" id="btnPlay">Main</button>
  <p class="best">Skor terbaik <b id="mBest">0</b></p>
  <div class="hints">
    <span class="g hint-kb"><span class="key">←</span><span class="key">→</span> Pindah jalur</span>
    <span class="g hint-kb"><span class="key">↑</span> Lompat</span>
    <span class="g hint-kb"><span class="key">↓</span> Geser</span>
    <span class="g hint-touch">Geser layar ke kiri, kanan, atas, atau bawah</span>
  </div>
  <button class="round menu-sound" id="btnSoundMenu" aria-label="Suara" aria-pressed="false">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="slash" d="M17 9l5 6M22 9l-5 6"/></svg>
  </button>
</section>

<section id="pause" class="screen veil" hidden>
  <div class="panel">
    <h2>Jeda</h2>
    <div class="stack" style="margin-top:18px">
      <button class="btn primary" id="btnResume">Lanjut</button>
      <button class="btn ghost" id="btnRestart">Ulangi dari awal</button>
      <button class="btn ghost" id="btnQuit">Menu utama</button>
    </div>
  </div>
</section>

<section id="over" class="screen veil" hidden>
  <div class="panel">
    <h2>Tabrakan!</h2>
    <div class="big" id="oScore">0</div>
    <span class="rec" id="oRecord" hidden>Rekor baru!</span>
    <dl class="stats">
      <div><dt>Jarak</dt><dd id="oDist">0 m</dd></div>
      <div><dt>Koin</dt><dd id="oCoins">0</dd></div>
      <div><dt>Terbaik</dt><dd id="oBest">0</dd></div>
    </dl>
    <div class="row">
      <button class="btn primary" id="btnAgain">Main lagi</button>
      <button class="btn ghost" id="btnMenu">Menu utama</button>
    </div>
  </div>
</section>

<div id="loader" class="loader" role="status" aria-live="polite">
  <h1 class="logo intro" id="loadLogo" aria-label="RUNNING CAT"></h1>
  <div class="prog">
    <div class="prog-top"><span id="ldMsg">Menyiapkan lintasan</span><span class="prog-pct" id="ldPct">0%</span></div>
    <div class="bar"><div class="bar-fill" id="ldFill"></div><div class="bar-dot" id="ldDot"></div></div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cvs = $('stage'), ctx = cvs.getContext('2d');
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const hash = n => { n = n | 0; n = (n ^ 61) ^ (n >>> 16); n = (n + (n << 3)) | 0; n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return (n >>> 0) / 4294967295; };

/* ---------- konstanta ---------- */
const BASE = 950, MAX = 2800, F = 520, PHALF = 45;
const G = 26, V0 = 8.4, BAR_H = 0.5, PH = 1.08, SLIDE_H = 0.5;
const LANES = [-1, 0, 1];
const BOX = [
  { f: '#2fc9bd', t: '#86f7ec', s: '#1b8d92', r: '#1a7a7d' },
  { f: '#ef4d6e', t: '#ff9bb0', s: '#a3314f', r: '#8a2742' },
  { f: '#e9a73f', t: '#ffd98a', s: '#a8721f', r: '#8f5f18' }
];

/* ---------- state ---------- */
let W = 0, H = 0, DPR = 1, U = 100, horizon = 0, groundY = 0, camX = 0;
let PX = 0, PY = 0, PS = 1;
let mesas = [], stars = [];
let mode = 'loading';
let travel = 0, speed = BASE, runTime = 0, coinCount = 0, hasShield = false, invuln = 0;
let nextRow = 0, lastFree = 0, nextTier = 12, crashT = 0, cdT = 0, cdFrozen = false, cdLast = -1;
let shake = 0, flash = 0, gtime = 0, dustT = 0, weaveT = 1;
let best = 0;
try { best = parseInt(localStorage.getItem('runningcat_best') || '0', 10) || 0; } catch (e) {}

const player = { x: 0, lane: 0, y: 0, vy: 0, slide: 0, run: 0 };
let obstacles = [], coins = [], powers = [], parts = [], bricks = [];
let lastClick = 0;
const lines = Array.from({ length: 30 }, () => ({ a: rnd(-0.1, 1.1) * Math.PI, p: Math.random() }));

/* ---------- audio ---------- */
let actx = null, muted = false, musicOn = false, mStep = 0;
function ensureAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx && actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
function tone(freq, dur, type, vol, to) {
  if (!actx || muted) return;
  try {
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol || 0.05, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
const BASS = [0,0,0,7,0,0,5,3, 0,0,0,7,10,10,7,5];
const LEAD = [12,-1,15,-1,19,-1,15,12, 17,-1,15,-1,12,-1,10,-1];
function musicTick() {
  if (!musicOn) return;
  const diff = clamp((speed - BASE) / (MAX - BASE), 0, 1);
  const ms = 60000 / (104 + diff * 64) / 2;
  if (mode === 'play' && actx && !muted) {
    tone(55 * Math.pow(2, BASS[mStep % 16] / 12), ms / 1000 * 0.9, 'triangle', 0.07);
    const l = LEAD[mStep % 16];
    if (l >= 0) tone(220 * Math.pow(2, l / 12), ms / 1000 * 0.7, 'square', 0.016);
    if (mStep % 2 === 0) tone(2400, 0.03, 'square', 0.01);
  }
  mStep++;
  setTimeout(musicTick, ms);
}
function toggleSound() {
  muted = !muted;
  ensureAudio();
  ['btnSoundHud', 'btnSoundMenu'].forEach(id => { $(id).classList.toggle('muted', muted); $(id).setAttribute('aria-pressed', String(muted)); });
}

/* ---------- ukuran layar ---------- */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

/* ---------- pembuat rintangan ---------- */

    if (it.k === 'pl') { drawPlayer(); continue; }
    if (it.k === 's') {
      if (it.zk < -240 || it.zk > 6300) continue;
      ctx.globalAlpha = clamp((6300 - it.zk) / 1300, 0, 1); drawSide(it, it.zk); ctx.globalAlpha = 1; continue;
    }
    if (it.k === 'o') {
      const o = it.o, z = o.pz - travel;
      if (z > 6300 || z + o.d < -240) continue;
      const fade = clamp((6300 - z) / 1300, 0, 1);
      ctx.globalAlpha = fade;
      if (o.t === 'barrier') { if (z > -240) drawBarrier(o, z); }
      else if (o.t === 'over') { if (z > -240) drawOver(o, z); }
      else drawBlock(o, z, fade);
      ctx.globalAlpha = 1; continue;
    }
    if (it.zk < -240 || it.zk > 6300) continue;
    ctx.globalAlpha = clamp((6300 - it.zk) / 1300, 0, 1);
    if (it.k === 'c') drawCoin(it.c, it.zk); else drawPower(it.p, it.zk);
    ctx.globalAlpha = 1;
  }
}
function drawParts() {
  for (const p of parts) { ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, p.size, p.size); }
  ctx.globalAlpha = 1;
}
function drawSpeedLines(dt) {
  if (mode !== 'play') return;
  const diff = clamp((speed - BASE) / (MAX - BASE), 0, 1), R = Math.hypot(W, H);
  ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (const l of lines) {
    l.p += dt * (0.5 + diff * 1.3);
    if (l.p > 1) { l.p = 0; l.a = rnd(-0.1, 1.1) * Math.PI; }
    const r0 = l.p * l.p * R * 0.9, r1 = r0 + 30 + l.p * R * 0.25 * (0.3 + diff);
    ctx.strokeStyle = 'rgba(255,244,230,' + (0.04 + 0.22 * diff * l.p) + ')';
    ctx.beginPath(); ctx.moveTo(W / 2 + Math.cos(l.a) * r0, horizon + Math.sin(l.a) * r0); ctx.lineTo(W / 2 + Math.cos(l.a) * r1, horizon + Math.sin(l.a) * r1); ctx.stroke();
  }
}
function render(dt) {
  camX = player.x * 0.55;
  ctx.save();
  if (shake > 0.01) ctx.translate((Math.random() - 0.5) * shake * 16, (Math.random() - 0.5) * shake * 16);
  drawSky(); drawGround(); drawItems(); drawBricks(); drawParts(); drawSpeedLines(dt);
  ctx.restore();
  if (flash > 0.01) { ctx.fillStyle = 'rgba(255,92,122,' + (flash * 0.45) + ')'; ctx.fillRect(0, 0, W, H); }
}

/* ---------- loading ---------- */
function runLoader() {
  const steps = [[0, 'Menyiapkan dunia RUNNING CAT'], [20, 'Membangun lintasan'], [42, 'Menempatkan rintangan'], [64, 'Memuat koin dan item spesial'], [84, 'Menyiapkan kucing pelari'], [97, 'Hampir siap — bersiaplah berlari!']];
  const t0 = performance.now(), minT = 4500;
  let fontsDone = false;
  const fr = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  Promise.race([fr, new Promise(r => setTimeout(r, 2500))]).then(() => { fontsDone = true; });
  function tick(now) {
    const t = clamp((now - t0) / minT, 0, 1);
    let p = 1 - Math.pow(1 - t, 2.2);
    if (!fontsDone) p = Math.min(p, 0.92);
    const pct = Math.max(1, Math.floor(p * 100));
    $('ldPct').textContent = pct + '%';
    $('ldFill').style.width = pct + '%'; $('ldDot').style.left = pct + '%';
    let msg = steps[0][1]; for (const s of steps) if (pct >= s[0]) msg = s[1];
    $('ldMsg').textContent = msg;
    if (pct < 100) { requestAnimationFrame(tick); return; }
    setTimeout(() => {
      $('loader').classList.add('done');
      toMenu();
      setTimeout(() => { $('loader').hidden = true; }, 950);
    }, 350);
  }
  requestAnimationFrame(tick);
}

/* ---------- mulai ---------- */
resize();
buildLogo($('loadLogo'), true);
buildLogo($('menuLogo'), false);
$('mBest').textContent = best.toLocaleString('id-ID');
resetGame();
runLoader();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (mode !== 'paused') update(dt); else gtime += dt;
  render(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
